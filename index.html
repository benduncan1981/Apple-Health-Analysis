<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Apple Health Large File Analyzer</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:-apple-system,BlinkMacSystemFont;
background:#f4f4f7;
margin:20px;
}

.container{
max-width:1200px;
margin:auto;
}

.upload{
border:2px dashed #bbb;
padding:40px;
text-align:center;
background:white;
border-radius:12px;
}

.controls{
margin-top:20px;
display:flex;
gap:10px;
flex-wrap:wrap;
}

select,button{
padding:8px;
border-radius:6px;
border:1px solid #ccc;
}

canvas{
margin-top:20px;
background:white;
border-radius:10px;
padding:10px;
}

</style>

</head>

<body>

<div class="container">

<h1>Apple Health Large Export Analyzer</h1>

<div class="upload">

<input type="file" id="fileInput">

<p>Upload Apple Health export.xml</p>

<div id="progress"></div>

</div>

<div class="controls">

<select id="metricA"></select>
<select id="metricB"></select>

<button onclick="compare()">Compare</button>

</div>

<canvas id="chart"></canvas>

</div>

<script>

const CHUNK_SIZE = 2 * 1024 * 1024

let rawData = {}
let dailyData = {}

document.getElementById("fileInput").addEventListener("change",handleFile)

async function handleFile(e){

const file = e.target.files[0]

const reader = file.stream().getReader()

let decoder = new TextDecoder()

let buffer = ""

let total = 0

while(true){

const {done,value} = await reader.read()

if(done) break

buffer += decoder.decode(value,{stream:true})

processBuffer()

total += value.length

document.getElementById("progress").innerText =
"Processed "+Math.round(total/1024/1024)+" MB"

}

buildDaily()
populateSelectors()

}

function processBuffer(){

const lines = buffer.split("<Record ")

buffer = lines.pop()

for(let line of lines){

parseRecord("<Record "+line)

}

}

function parseRecord(xml){

const typeMatch = xml.match(/type="([^"]+)"/)
const valueMatch = xml.match(/value="([^"]+)"/)
const dateMatch = xml.match(/startDate="([^"]+)"/)

if(!typeMatch || !valueMatch || !dateMatch) return

const type = typeMatch[1]
const value = parseFloat(valueMatch[1])
const date = new Date(dateMatch[1])

if(!value) return

if(!rawData[type]) rawData[type] = []

rawData[type].push({date,value})

}

function buildDaily(){

Object.keys(rawData).forEach(type=>{

const map={}

rawData[type].forEach(entry=>{

const day = entry.date.toISOString().split("T")[0]

if(!map[day]) map[day]=[]

map[day].push(entry.value)

})

dailyData[type]={}

Object.keys(map).forEach(day=>{

const arr = map[day]

dailyData[type][day] =
arr.reduce((a,b)=>a+b)/arr.length

})

})

}

function populateSelectors(){

const A=document.getElementById("metricA")
const B=document.getElementById("metricB")

Object.keys(dailyData).forEach(type=>{

let name = type.replace("HKQuantityTypeIdentifier","")

let opt=document.createElement("option")
opt.value=type
opt.text=name

A.appendChild(opt.cloneNode(true))
B.appendChild(opt.cloneNode(true))

})

}

function compare(){

const A=document.getElementById("metricA").value
const B=document.getElementById("metricB").value

const dataA=dailyData[A]
const dataB=dailyData[B]

const dates = Object.keys(dataA).filter(d=>dataB[d])

const valuesA = dates.map(d=>dataA[d])
const valuesB = dates.map(d=>dataB[d])

drawChart(dates,valuesA,valuesB,A,B)

}

let chart

function drawChart(dates,a,b,A,B){

if(chart) chart.destroy()

chart=new Chart(document.getElementById("chart"),{

type:"line",

data:{
labels:dates,
datasets:[
{label:A,data:a},
{label:B,data:b}
]
}

})

}

</script>

</body>
</html>
